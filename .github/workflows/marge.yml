name: Merge streams into episodes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (tidak mengubah file)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge streams
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: python3 merge_streams.py

      - name: Commit & push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️  Tidak ada perubahan"
            exit 0
          fi

          STAT=$(git diff --staged --shortstat)
          echo "Changes: $STAT"

          git commit -m "refactor: merge streams into episodes (chunk 6, object format)"
          git push