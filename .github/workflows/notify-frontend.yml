name: Notify Frontends

on:
   push:
     branches: [main, dev]
     paths:
       - 'src/content/anime/**'
       - 'data/anime/**'
   workflow_dispatch:
  
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger qimochi rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FRONTEND_PAT }}
          repository: bimaakbar-dev/qimochi
          event-type: data-updated
